# solfin-osc — bespoke pointer-first OSC. Options map to user_opts in solfin-osc.lua.

# Solar accent (matches the SwiftUI app tint / Solfin sun motif)
accent_color=#FF4F0F
solar_gold_color=#FFAD29
solar_red_color=#F2140F

# Optional raw BGRA title logo overlay. The app fills these at launch when Jellyfin
# has a transparent Logo image for the movie/series.
logo_path=
logo_width=0
logo_height=0
logo_overlay_id=43

# ms of pointer stillness before the OSC fades out
hidetimeout=1800

# ms fade in/out (0 disables the animation)
fadeduration=200

# exact (accurate) seeks from the seekbar; set to no for faster keyframe seeks
seek_precise=yes

# seconds for the skip-back / skip-forward buttons
jump_amount=10
