# solfin — ModernZ OSC: polished, feature-rich, macOS-blue accent.
# Only keys from the upstream Samillion/ModernZ reference are used.

# --- Layout / behaviour ---
layout=default
icon_theme=fluent
window_top_bar=auto
show_title=yes
title=${media-title}
show_window_title=no
window_controls=yes
hidetimeout=1800
fadeduration=200
osc_on_seek=yes

# --- Buttons: enable the useful ones, hide clutter ---
subtitles_button=yes
audio_tracks_button=yes
jump_buttons=yes
jump_amount=10
chapter_skip_buttons=yes
track_nextprev_buttons=yes
playlist_button=yes
hide_empty_playlist_button=yes
info_button=yes
ontop_button=yes
screenshot_button=yes
speed_button=yes
loop_button=no
shuffle_button=no
download_button=no
zoom_control=no

# --- Seekbar: chapter markers, buffered range, rounded, thumbnails ---
seekbar_height=medium
seekrange=yes
livemarkers=yes
seekbarkeyframes=no
slider_rounded_corners=yes
nibbles_style=gap
nibbles_top=yes
nibbles_bottom=yes

# --- No progress line when the OSC is hidden; show the OSC only ---
persistent_progress=no
persistent_buffer=no

# --- Chapter title shown above the bar ---
show_chapter_title=yes

# --- macOS-blue accent (matches the SwiftUI app tint) ---
seekbarfg_color=#0A84FF
seek_handle_color=#0A84FF
seek_handle_border_color=#0A84FF
hover_effect_color=#0A84FF
nibble_color=#0A84FF
