# thumbfast — on-the-fly seek thumbnails for solfin-osc.
# Solfin-maintained fork of https://github.com/po5/thumbfast (MPL-2.0).
# Keep local patches; see scripts/thumbfast.lua and tools/THUMBNAILS.md.

# Start one auxiliary decode stream just after playback loads, so the first
# seekbar hover doesn't pay worker/HTTP-open latency. Overlay id 44 is separate
# from Solfin's OSC/logo overlays.
solfin_managed=yes
overlay_id=44

# solfin direct-plays over HTTP from Jellyfin, so network sources MUST be
# enabled or thumbnails stay disabled.
network=yes

# Max thumbnail size (aspect preserved; 16:9 -> ~256x144).
max_width=256
max_height=256

# Avoid thumbfast's first-attempt HDR tone-map worker on macOS. On some files that
# subprocess fails, then thumbfast retries successfully without tone mapping, causing
# a noisy "cannot create mpv subprocess" OSD despite thumbnails working.
tone_mapping=no

# Generate album-art style thumbs for audio too (harmless for video).
audio=no

# Warm the thumbnail worker as soon as the playback file is loaded.
spawn_first=yes

# Keep the worker alive during playback after hovering, avoiding cold re-open.
# Clear/end-file shuts it down; this timer covers idle seeks (0 = never).
quit_after_inactivity=0
