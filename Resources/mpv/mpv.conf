# solfin — curated mpv config for a power-user Jellyfin client.
# This bundled config is loaded with --config-dir; Solfin separately directs mpv's
# writable watch-later and cache paths to its own Application Support directory.

# ---------------------------------------------------------------------------
# OSD / UI: the bundled solfin-osc.lua owns all on-screen drawing
# (scripts/solfin-osc.lua, configured in script-opts/solfin-osc.conf).
# ---------------------------------------------------------------------------
osc=no
border=no
osd-bar=no
load-stats-overlay=yes

# Let macOS maximize/zoom use the full available screen area. mpv still preserves
# the video aspect internally, adding black gutters instead of constraining the
# window itself to the video aspect ratio.
keepaspect-window=no

# Cap the restored window to the current display. Test fullscreen restoration
# across displays separately.
autofit-larger=90%x90%
geometry=50%:50%

# ---------------------------------------------------------------------------
# Video output & hardware decoding (macOS)
# ---------------------------------------------------------------------------
vo=gpu-next
gpu-api=auto
# MPVProcess overrides to auto on mpv 0.40+; auto-safe remains for older versions.
hwdec=auto-safe

# ---------------------------------------------------------------------------
# Quality: high-quality scaling for direct-play originals
# ---------------------------------------------------------------------------
profile=high-quality
dscale=mitchell

# ---------------------------------------------------------------------------
# Subtitle settings (VLC-like)
# ---------------------------------------------------------------------------
# mpv's default sub-font-size is 55, which is very large. VLC renders subs
# noticeably smaller with a clean white-on-black-outline look. These options
# reproduce that style. Tweak sub-font-size to taste (higher = bigger).
slang=eng,en
alang=eng,en,jpn,ja
sub-auto=fuzzy
sub-visibility=yes

# Font family. VLC ships/uses a plain sans; system default works well.
sub-font=sans-serif

# Text size. VLC-ish default. Bump to ~40-45 if you want them larger.
sub-font-size=36

# Solid white text.
sub-color="#FFFFFFFF"

# A restrained outline plus shadow keeps text legible against bright scenes.
sub-outline-color="#FF000000"
sub-outline-size=0.5
sub-border-style=outline-and-shadow
sub-shadow-offset=1.5
# mpv uses sub-back-color for the shadow when outline-and-shadow is selected.
sub-back-color="#E0000000"

# Bold off (VLC default is not bold). Set to yes if you prefer heavier text.
sub-bold=no

# Vertical position: lower sub-pos values move subtitles up from the bottom edge.
sub-pos=98

# Scale subtitle text with the window.
sub-scale-by-window=yes

# Preserve styling authored in ASS/SSA subtitle tracks.
sub-ass-override=no

# ---------------------------------------------------------------------------
# Cache / network buffering
# ---------------------------------------------------------------------------
# Streaming from a Jellyfin server, so a healthy cache smooths out network
# hiccups and seeking. mpv caches into RAM by default.
cache=yes

# How far ahead to buffer, in seconds. mpv stops early if it hits the byte cap.
cache-secs=1800
# Do not wait for initial cache fill before starting playback.
cache-pause-initial=no

# Maximum forward cache and backward cache for instant rewind.
demuxer-max-bytes=4GiB
demuxer-max-back-bytes=1GiB

# ---------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------
# Leave codec DRC disabled; users can adjust volume and output configuration as needed.
ad-lavc-ac3drc=0
audio-channels=auto-safe
# Normalize channel downmixes where needed; consider disabling if you prefer
# unnormalized source levels.
audio-normalize-downmix=yes
# Allow volume boost above 100%; this is not a clipping limiter.
volume-max=130

# ---------------------------------------------------------------------------
# Resume is owned by Jellyfin; don't let mpv restore or save playback positions.
# ---------------------------------------------------------------------------
resume-playback=no
save-position-on-quit=no
keep-open=no
