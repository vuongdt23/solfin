# solfin — curated mpv config for a power-user Jellyfin client.
# This config-dir is passed via --config-dir so it never touches ~/.config/mpv.

# ---------------------------------------------------------------------------
# OSD / UI: the bundled solfin-osc.lua owns all on-screen drawing
# (scripts/solfin-osc.lua, configured in script-opts/solfin-osc.conf).
# ---------------------------------------------------------------------------
osc=no
border=no
osd-bar=no
load-stats-overlay=yes

# Let macOS maximize/zoom use the full available screen area. mpv still preserves
# the video aspect internally, adding black gutters instead of constraining the
# window itself to the video aspect ratio.
keepaspect-window=no

# When leaving fullscreen, cap the restored window to the current display instead
# of falling back to the source video size (e.g. a 4K window on a laptop panel).
# This preserves smaller videos at natural size but constrains oversized media.
autofit-larger=90%x90%
geometry=50%:50%
force-window-position=yes

# ---------------------------------------------------------------------------
# Video output & hardware decoding (macOS)
# ---------------------------------------------------------------------------
vo=gpu-next
gpu-api=auto
# auto-safe picks a safe hw decoder (VideoToolbox on macOS) and falls back cleanly.
hwdec=auto-safe

# ---------------------------------------------------------------------------
# Quality: high-quality scaling for direct-play originals
# ---------------------------------------------------------------------------
profile=high-quality
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# ---------------------------------------------------------------------------
# Subtitle settings (VLC-like)
# ---------------------------------------------------------------------------
# mpv's default sub-font-size is 55, which is very large. VLC renders subs
# noticeably smaller with a clean white-on-black-outline look. These options
# reproduce that style. Tweak sub-font-size to taste (higher = bigger).
slang=eng,en
alang=eng,en,jpn,ja
sub-auto=fuzzy
sub-visibility=yes

# Font family. VLC ships/uses a plain sans; system default works well.
sub-font=sans-serif

# Text size. VLC-ish default. Bump to ~40-45 if you want them larger.
sub-font-size=36

# Solid white text.
sub-color="#FFFFFFFF"

# Slight outline for definition, with shadow doing the rest.
sub-border-color="#FF000000"
sub-border-size=0.5

# Shadow carries most of the readability.
sub-shadow-offset=1.5
sub-shadow-color="#E0000000"

# No opaque background box behind the text (VLC default is transparent).
sub-back-color="#00000000"

# Bold off (VLC default is not bold). Set to yes if you prefer heavier text.
sub-bold=no

# Vertical position: distance from bottom edge (0 = bottom, 100 = top).
sub-pos=98

# Keep subtitle size stable regardless of window/video resolution.
sub-scale-by-window=yes

# When a subtitle track carries its own styling (ASS/SSA), respect it.
# Set to no if you want your settings above to always override embedded styles.
sub-ass-override=scale

# ---------------------------------------------------------------------------
# Cache / network buffering
# ---------------------------------------------------------------------------
# Streaming from a Jellyfin server, so a healthy cache smooths out network
# hiccups and seeking. mpv caches into RAM by default.
cache=yes

# How far ahead to buffer, in seconds. This is the main knob for how far the
# "loaded" bar advances. 900 = try to keep ~15 min buffered ahead. mpv stops
# early if it hits demuxer-max-bytes first (common at high bitrate).
cache-secs=900
demuxer-readahead-secs=900

# Max RAM the forward cache may use. Raise this if the buffer bar stops short
# of cache-secs — at high bitrate the byte cap is what's limiting readahead,
# not the seconds. 2 GiB holds ~15 min of a ~18 Mbps 1080p stream.
demuxer-max-bytes=4GiB

# Cache kept behind the playhead for instant rewind (no re-download).
demuxer-max-back-bytes=1GiB

# Allow seeking anywhere even on streams the server marks non-seekable.
force-seekable=yes

# ---------------------------------------------------------------------------
# Audio settings (fix E-AC3 volume pumping / weird level swings)
# ---------------------------------------------------------------------------
# Background: Jellyfin was transcoding EAC3 -> Opus server-side, which bakes
# Dolby's dynamic-range-compression (DRC) into the stream and mangles levels.
# The real fix is letting MPV decode EAC3 natively (solfin direct-plays the
# original file, so it does). These options then control the dynamics locally.
# --- Dynamic Range Compression ---
#   0   = full dynamic range, no compression (best for real speakers / quiet
#         room; stops the "loud action, squashed dialogue" pumping)
#   1   = maximum compression (night mode); 0.5 = middle ground
ad-lavc-ac3drc=0
# --- Channel layout ---
# auto-safe picks a layout your output device actually supports, avoiding a
# forced downmix that can re-normalize (and jump) levels.
audio-channels=auto-safe
# When a downmix IS needed (5.1 -> stereo), preserve original levels instead of
# renormalizing them. Stops sudden level changes.
audio-normalize-downmix=no
# --- Software volume headroom ---
# Allow boosting past 100% for quiet sources without clipping the OS mixer.
volume-max=130

# ---------------------------------------------------------------------------
# Resume is owned by Jellyfin; don't let mpv persist its own positions.
# ---------------------------------------------------------------------------
save-position-on-quit=no
# Keep the mpv process alive after a truncated network stream. The bundled
# network-retry.lua script reloads the URL with exponential backoff.
keep-open=yes
script=scripts/network-retry.lua
# Give transient Jellyfin/Caddy outages time to recover before retrying.
network-timeout=5

# Precautionary: never let sub-pos leak into any watch-later state (we don't
# persist positions anyway; Jellyfin owns resume).
watch-later-options-remove=sub-pos
