# solfin input bindings — power-user seek/subtitle nudges.
# solfin-osc.lua draws the pointer-driven OSC (left-click controls). A global
# right-click opens mpv's built-in select menu as a power-user fallback.

mbtn_right    script-binding select/menu

# Seeking (power-user granular)
RIGHT         seek  5
LEFT          seek -5
UP            seek  60
DOWN          seek -60
Shift+RIGHT   seek  1  exact
Shift+LEFT    seek -1  exact

# Track cycling
j             cycle sub
J             cycle sub down
a             cycle audio

# Subtitle timing nudge
z             add sub-delay -0.1
Z             add sub-delay  0.1
